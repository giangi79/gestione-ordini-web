<head>
  <meta charset="UTF-8" />

  <meta name="theme-color" content="#1a1d21" />
  <meta name="apple-mobile-web-app-capable" content="yes" />

  <meta name="apple-mobile-web-app-title" content="Gestione Ordini" />

  <meta http-equiv="Pragma" content="no-cache" />

  <link rel="manifest" href="/gestione-ordini-web/manifest.webmanifest?v=20261004-3" />

  <title>Gestione Ordini</title>
</head>
<body>
  <div id="root"></div>
  <script>
    // Rimuove eventuali service worker/cache rimasti da versioni precedenti.
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(registrations => {
        registrations.forEach(registration => registration.unregister());
      });
    }
    if ('caches' in window) {
      caches.keys().then(keys => Promise.all(keys.map(key => caches.delete(key))));
    }
  </script>
  <script type="module" src="/src/main-mobile.jsx"></script>
</body>
</html>
